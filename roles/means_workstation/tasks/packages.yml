---

- name: 'Install workstation packages (retry every minute for 3 hours (waiting for lock))'
  become: true
  apt:
    name: "{{ apt_packages_workstation }}"
    force_apt_get: yes
    update_cache: yes
    state: latest
  retries: 180
  delay: 60

- name: 'Install libvirt packages'
  become: true
  apt:
    name: "{{ apt_packages_libvirt }}"
    force_apt_get: yes
    update_cache: yes
    state: latest
  when: virtualization_type == 'libvirt'

- name: 'Install virtualbox packages'
  become: true
  apt:
    name: "{{ apt_packages_virtualbox }}"
    force_apt_get: yes
    update_cache: yes
    state: latest
  when: virtualization_type == 'virtualbox'
