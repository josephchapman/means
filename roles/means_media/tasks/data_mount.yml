---

- name: "Add LVM volumes to fstab with systemd automount"
  become: true
  ansible.posix.mount:
    path: "/mnt/{{ item.vg }}/{{ item.lv }}"
    src: "/dev/mapper/{{ item.vg }}-{{ item.lv }}"
    fstype: ext4
    opts: "defaults,noauto,x-systemd.automount,x-systemd.idle-timeout=10min"
    state: present
    dump: 0
    passno: 2
  loop: "{{ device_mapper }}"
  notify: systemctl daemon-reload

